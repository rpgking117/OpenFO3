[package]
name = "openfo3-launcher"
version = "1.0.1"
description = "OpenFO3's launcher: finds your Fallout 3, picks plugins and display settings, starts the game"
authors = ["RPGKING The Mad Modder"]
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, so the engine builds without the launcher's GUI crates.
[workspace]

[[bin]]
name = "openfo3-launcher"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
